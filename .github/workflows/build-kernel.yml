name: Build vermeer kernel (KernelSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (default: vermeer-<run number>)'
        required: false
        default: ''
      apply_performance:
        description: 'Apply the optional performance patch set'
        type: boolean
        required: false
        default: true
      susfs_commit:
        description: 'Override SUSFS commit pin (blank = use repository pin)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - lineage-24.0

permissions:
  contents: write

concurrency:
  group: vermeer-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel
  CI_DIR: ${{ github.workspace }}/kernel/ci
  OUT_DIR: ${{ github.workspace }}/out
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
  APPLY_PERFORMANCE: ${{ github.event.inputs.apply_performance || 'true' }}
  SUSFS_COMMIT: ${{ github.event.inputs.susfs_commit || '' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Check SUSFS update availability
        id: susfs-check
        run: |
          bash "$CI_DIR/scripts/check-susfs-update.sh" \
            --pin-file "$CI_DIR/scripts/apply-patches.sh" \
            --doc-file "" \
            --json "$GITHUB_WORKSPACE/susfs-update.json"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          for i in 1 2 3; do
            sudo apt-get install -y -qq \
              bc bison flex libssl-dev libelf-dev libdw-dev dwarves cmake \
              build-essential curl git zip unzip python3 device-tree-compiler \
              lz4 zstd xz-utils ccache \
              binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
              binutils-arm-linux-gnueabihf gcc-arm-linux-gnueabihf && break
            sudo dpkg --configure -a || true
            sleep 5
          done
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download AOSP Clang 14 (r450784e)
        run: |
          set -euo pipefail
          mkdir -p "$TOOLCHAIN_DIR/clang"
          AOSP_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz"
          MIRROR_URL="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz"
          download() {
            curl -fL --retry 8 --retry-delay 10 --retry-all-errors \
              --connect-timeout 30 --max-time 3600 -o "$1" "$2"
          }
          # Googlesource sometimes returns 503 for this archive; fall back to a
          # byte-for-byte mirror hosted on GitHub Releases.
          if ! download "$TOOLCHAIN_DIR/clang.tar.gz" "$AOSP_URL"; then
            echo "::warning::AOSP archive download failed; falling back to the GitHub mirror"
            rm -f "$TOOLCHAIN_DIR/clang.tar.gz"
            download "$TOOLCHAIN_DIR/clang.tar.gz" "$MIRROR_URL"
          fi
          tar -xzf "$TOOLCHAIN_DIR/clang.tar.gz" -C "$TOOLCHAIN_DIR/clang"
          # The mirror tarball may contain a top-level clang-r450784e/ directory.
          CLANG_BIN="$(dirname "$(find "$TOOLCHAIN_DIR/clang" -type f -path '*/bin/clang' -print -quit)")"
          [ -n "$CLANG_BIN" ] && [ -x "$CLANG_BIN/clang" ] || {
            echo "clang executable not found in downloaded archive" >&2; exit 1
          }
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "BINUTILS_BIN=/usr/bin" >> "$GITHUB_ENV"
          "$CLANG_BIN/clang" --version | head -n 1

      - name: Build pahole 1.31 for BTF generation
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.31 https://github.com/acmel/dwarves.git "$RUNNER_TEMP/dwarves"
          mkdir -p "$RUNNER_TEMP/dwarves/build"
          cd "$RUNNER_TEMP/dwarves/build"
          cmake -D__LIB=lib -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release .. >/dev/null
          make -j"$(nproc)" pahole
          sudo make install pahole
          sudo ldconfig
          pahole --version

      - name: Apply feature patches and integrations
        run: |
          bash "$CI_DIR/scripts/apply-patches.sh" \
            --kernel "$KERNEL_DIR" \
            --additions "$CI_DIR" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Generate .config
        run: |
          bash "$CI_DIR/scripts/merge-config.sh" \
            --kernel "$KERNEL_DIR" \
            --additions "$CI_DIR" \
            --workspace "$GITHUB_WORKSPACE" \
            --out "$OUT_DIR"

      - name: Build kernel
        run: |
          bash "$CI_DIR/scripts/build-kernel.sh" \
            --kernel "$KERNEL_DIR" \
            --out "$OUT_DIR" \
            --jobs "$(nproc)"

      - name: Package AnyKernel3 flashable ZIP
        id: package
        run: |
          set -euo pipefail
          AK="$CI_DIR/anykernel3"
          IMG="$OUT_DIR/arch/arm64/boot/Image.gz"
          [ -f "$IMG" ] || { echo "Image.gz missing" >&2; exit 1; }
          cp "$IMG" "$AK/Image.gz"

          STAGE="$GITHUB_WORKSPACE/release"
          mkdir -p "$STAGE"
          TAG="${{ github.event.inputs.release_tag || format('vermeer-{0}', github.run_number) }}"
          ZIPNAME="AnyKernel3-vermeer-${TAG}.zip"
          ( cd "$AK" && zip -r9 "$STAGE/$ZIPNAME" . -x '*.git*' )

          # Extra, non-flashable artifacts for debugging / module-heavy setups.
          cp "$IMG" "$STAGE/Image.gz"
          [ -f "$OUT_DIR/System.map" ] && cp "$OUT_DIR/System.map" "$STAGE/System.map"
          [ -f "$OUT_DIR/.config" ] && cp "$OUT_DIR/.config" "$STAGE/defconfig"
          if [ -d "$OUT_DIR/arch/arm64/boot/dts/qcom" ]; then
            tar -czf "$STAGE/dtbs-vermeer-${TAG}.tar.gz" \
              -C "$OUT_DIR/arch/arm64/boot/dts" qcom
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$STAGE/$ZIPNAME" >> "$GITHUB_OUTPUT"
          ls -lh "$STAGE"

      - name: Upload raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-kernel-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/release/*
            ${{ github.workspace }}/susfs-update.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Vermeer kernel - ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: ${{ github.workspace }}/release/*
